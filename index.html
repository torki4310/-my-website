<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض أعمالي</title>
  <meta name="description" content="معرض أعمالي — برامجي ومشاريعي" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // تطبيق الوضع المحفوظ قبل الرسم لتجنّب الوميض
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo" id="logo"></a>
      <nav class="nav-links">
        <a href="#projects">المشاريع</a>
        <a href="#about">نبذة</a>
        <a href="#contact">تواصل</a>
      </nav>
      <button class="icon-btn" id="themeToggle" aria-label="تبديل الوضع الليلي">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero container">
      <div class="avatar" id="avatar"></div>
      <div>
        <p class="eyebrow" id="title"></p>
        <h1 id="name"></h1>
        <p class="bio" id="bio"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn primary">تصفّح المشاريع</a>
          <a href="#contact" class="btn">تواصل معي</a>
        </div>
      </div>
    </section>

    <section class="stats container" id="stats"></section>

    <section id="projects" class="container section">
      <div class="section-head">
        <h2>المشاريع والبرامج</h2>
        <input type="search" id="search" placeholder="ابحث عن مشروع أو تقنية…" aria-label="بحث" />
      </div>
      <div class="filters" id="filters" role="tablist"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>لا توجد مشاريع مطابقة.</p>
    </section>

    <section id="about" class="container section">
      <h2>المهارات والتقنيات</h2>
      <ul class="skills" id="skills"></ul>
    </section>

    <section id="contact" class="container section contact">
      <h2>لنعمل معاً</h2>
      <p>عندك فكرة مشروع أو فرصة تعاون؟ راسلني.</p>
      <a class="btn primary" id="emailBtn"></a>
      <div class="socials" id="socials"></div>
    </section>
  </main>

  <footer class="container footer">
    <p>© <span id="year"></span> <span id="footerName"></span></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
