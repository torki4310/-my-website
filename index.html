<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض أعمالي</title>
  <meta name="description" content="معرض أعمالي — برامجي ومشاريعي" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- الخلفية: صورة اختيارية + شبكة متحركة -->
  <div class="bg" id="bgImage" aria-hidden="true"></div>
  <canvas id="network" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo" id="logo"></a>
      <nav class="nav-links">
        <a href="#top">المشاريع</a>
        <a href="#about">المهارات</a>
        <a href="#contact">تواصل</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-head">
        <p class="eyebrow" id="title"></p>
        <h1 id="name"></h1>
        <p class="bio" id="bio"></p>
      </div>

      <div class="filters container" id="filters" role="tablist" aria-label="تصفية المشاريع"></div>

      <div class="stage" id="stage" tabindex="0" aria-label="معرض المشاريع ثلاثي الأبعاد — اسحب أو استخدم الأسهم للتنقل">
        <div class="ring" id="ring"></div>
      </div>

      <div class="controls">
        <button class="arrow" id="prev" aria-label="المشروع السابق">→</button>
        <span class="counter" id="counter"></span>
        <button class="arrow" id="next" aria-label="المشروع التالي">←</button>
      </div>

      <article class="details container" id="details" aria-live="polite"></article>
      <p class="hint">اسحب الدائرة أو اضغط على أي مشروع لاختياره</p>
    </section>

    <section id="about" class="container section">
      <div class="panel">
        <h2>المهارات والتقنيات</h2>
        <ul class="skills" id="skills"></ul>
      </div>
    </section>

    <section id="contact" class="container section">
      <div class="panel contact">
        <h2>لنعمل معاً</h2>
        <p>عندك فكرة مشروع أو فرصة تعاون؟ راسلني.</p>
        <a class="btn primary" id="emailBtn"></a>
        <div class="socials" id="socials"></div>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <p>© <span id="year"></span> <span id="footerName"></span></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
